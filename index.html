<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>א.י.א גיוס והשמה</title>
<link rel="canonical" href="https://aia-jobs.co.il/">
<meta property="og:title" content="א.י.א גיוס והשמה — משרות פתוחות">
<meta property="og:description" content="משרות פתוחות בכל הארץ. מחפשים משרה ושולחים הודעה בוואטסאפ.">
<meta property="og:image" content="https://aia-jobs.co.il/hero.webp">
<link rel="icon" href="logo.webp">
<meta name="description" content="א.י.א גיוס והשמה — משרות פתוחות בכל הארץ. מחפשים משרה ושולחים הודעה בוואטסאפ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@400;500;600&display=swap">
<style>
/* Layout: category-leader pattern (full-bleed person photo + job search panel), done in AIA blue,
   with WhatsApp as the one thing the big agencies don't offer. Deliberate single light look. */
:root{
  color-scheme:light;
  --ink:#0b1f3a; --grey:#56627a; --line:#e2e8f1; --soft:#f2f6fb; --white:#ffffff;
  --blue:#1468b8; --blue-d:#0d4a8a; --blue-l:#e6f0fb;
  --wa:#1faa59; --wa-d:#168a47;
  --display:"Rubik","Heebo",system-ui,sans-serif;
  --body:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--white)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--white);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;box-shadow:0 1px 0 var(--line)}
.hd{display:flex;align-items:center;gap:20px;padding-block:8px}
.brand{display:flex;align-items:center;text-decoration:none;margin-inline-end:auto}
.brand img{height:54px;width:auto}
.nav{display:flex;gap:24px;font-weight:500;font-size:.95rem}
.nav a{text-decoration:none}.nav a:hover{color:var(--blue)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px}
.langs button{border:0;background:none;color:var(--grey);font:600 .78rem var(--body);padding:5px 8px;border-radius:6px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 1rem var(--body);text-decoration:none;padding:14px 24px;border:0;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:20px;height:20px;flex:none}
.btn-wa{background:var(--wa);color:#fff}.btn-wa:hover{background:var(--wa-d)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-d)}
.btn-line{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg a{padding:7px 14px;border-radius:8px;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--grey);white-space:nowrap}
.seg a[aria-current="true"]{background:var(--ink);color:#fff}
@media (max-width:620px){.hd{flex-wrap:wrap;row-gap:8px}.seg{order:10;flex-basis:100%;justify-content:stretch}.seg a{flex:1;text-align:center;padding:9px 8px}}
.emp-link{font-weight:600;color:#fff;background:var(--ink);padding:9px 16px;border-radius:8px;text-decoration:none;font-size:.9rem}
.hd .btn{padding:9px 14px;font-size:.88rem}
@media (max-width:960px){.nav{display:none}}
@media (max-width:620px){.emp-link{display:none}.hd .btn span{display:none}.hd .btn{padding:9px}.brand img{height:46px}}

/* hero */
.hero{position:relative;color:#fff;background:#0b1f3a}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 30%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(9,28,56,.94) 0%,rgba(9,28,56,.82) 42%,rgba(9,28,56,.25) 75%,rgba(9,28,56,.1) 100%)}
[dir="ltr"] .hero::after{background:linear-gradient(90deg,rgba(9,28,56,.94) 0%,rgba(9,28,56,.82) 42%,rgba(9,28,56,.25) 75%,rgba(9,28,56,.1) 100%)}
.hero .wrap{position:relative;z-index:1;padding-block:70px 90px}
.hero-in{max-width:620px}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:500}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#45d483}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,5.6vw,4rem);line-height:1.08;margin:.45em 0 .35em;text-wrap:balance}
h1 em{font-style:normal;color:#7cc0ff}
.lead{font-size:1.12rem;color:#d6e3f3;margin:0 0 28px;max-width:46ch}
.search{background:#fff;color:var(--ink);border-radius:16px;padding:10px;display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55)}
.search label{display:flex;flex-direction:column;padding:6px 12px;border-radius:10px;background:var(--soft);min-width:0}
.search label span{font-size:.72rem;font-weight:600;color:var(--grey)}
.search input,.search select{border:0;background:transparent;font:500 1rem var(--body);color:var(--ink);padding:2px 0;outline:none;width:100%;min-width:0}
.search .btn{padding:0 26px}
.or{margin-top:16px;font-size:.95rem;color:#d6e3f3;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.or a{color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5)}
.or svg{width:18px;height:18px;color:#45d483}
@media (max-width:760px){.search{grid-template-columns:1fr}.search .btn{padding:14px}.hero .wrap{padding-block:44px 60px}.hero::after{background:linear-gradient(0deg,rgba(9,28,56,.95) 0%,rgba(9,28,56,.85) 60%,rgba(9,28,56,.55) 100%)!important}}

.hint{margin-top:12px;border:0;background:#fff;color:var(--blue);font:700 1rem var(--body);padding:10px 16px;border-radius:10px;cursor:pointer;box-shadow:0 10px 24px -14px rgba(0,0,0,.6)}
.note{margin:0;padding:12px 16px;border-radius:10px;background:#fff6e0;color:#6b4a00;font-weight:500}
/* trust strip */
.trust{background:var(--blue);color:#fff}
.trust ul{list-style:none;margin-block:0;margin-inline:auto;padding-block:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.trust li{display:flex;align-items:center;gap:12px;font-weight:500;font-size:.95rem}
.trust b{font-family:var(--display);font-size:1.5rem;font-weight:800}
.trust svg{width:28px;height:28px;flex:none;opacity:.9}
@media (max-width:860px){.trust ul{grid-template-columns:1fr 1fr}.trust li{flex-direction:column;align-items:flex-start;gap:2px;font-size:.88rem}}

section{padding-block:70px}
section[id]{scroll-margin-top:80px}
@media (max-width:620px){section[id]{scroll-margin-top:124px}}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--grey);margin:0 0 28px;max-width:60ch}

/* categories */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:start;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,box-shadow .2s,transform .2s}
.cat:hover,.cat[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 12px 30px -18px rgba(20,104,184,.6);transform:translateY(-2px)}
.cat .ic{width:52px;height:52px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center}
.cat .ic svg{width:28px;height:28px}
.cat b{font-size:1.08rem}
.cat small{color:var(--grey);font-size:.88rem}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){.cats{grid-template-columns:1fr 1fr}.cat[data-cat="all"]{grid-column:1/-1}}

/* jobs */
.jsearch{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:10;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:18px;box-shadow:0 16px 30px -24px rgba(11,31,58,.5)}
.jfield{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:10px 14px;min-width:0}
.jfield svg{width:20px;height:20px;flex:none;color:var(--blue)}
.jfield input,.jfield select{border:0;background:transparent;font:500 1rem var(--body);color:var(--ink);outline:none;width:100%;min-width:0}
.jchips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.jchip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 .9rem var(--body);cursor:pointer}
.jchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
@media (max-width:620px){
 .jsearch{grid-template-columns:1.25fr 1fr;gap:8px;padding:8px;border-radius:14px;top:calc(env(safe-area-inset-top,0px) + 112px)}
 .jfield{padding:9px 10px;gap:6px}.jfield svg{width:17px;height:17px}.jfield input,.jfield select{font-size:.95rem}
 .jchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-8px;padding-inline:8px}.jchips::-webkit-scrollbar{display:none}
 .jchip{white-space:nowrap;padding:6px 12px;font-size:.85rem}
 .cats{gap:10px}.cat{flex-direction:row;align-items:center;padding:14px;gap:12px}.cat .ic{width:42px;height:42px}.cat .ic svg{width:22px;height:22px}.cat small{display:none}.cat b{font-size:.98rem}
 .job{padding:16px}.job ul{grid-template-columns:1fr 1fr}.job ul li:last-child{grid-column:1/-1}
 section{padding-block:48px}
}
.jobs-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.count{margin:0;font-weight:600}
.clear{border:0;background:none;color:var(--blue);font:600 .9rem var(--body);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.job{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .2s,border-color .2s}
.job:hover{border-color:#bcd3ee;box-shadow:0 14px 30px -20px rgba(11,31,58,.45)}
.job .top{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:600}
.job .ref{color:var(--blue);letter-spacing:.06em}
.job .badge{background:var(--soft);color:var(--grey);padding:2px 8px;border-radius:6px}
.jt{display:flex;align-items:center;gap:12px}
.ji{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--blue-l);color:var(--blue)}
.ji svg{width:28px;height:28px}
.ji-chef,.ji-serve,.ji-dish,.ji-knife{background:#fff1e6;color:#d2600f}
.ji-coffee{background:#f6ede4;color:#8a5a2b}
.ji-broom,.ji-bed{background:#e8f7ef;color:#178a4b}
.ji-box,.ji-truck{background:#eef0ff;color:#4b53c9}
.ji-flame,.ji-wrench,.ji-gear{background:#fff4d6;color:#b07800}
.ji-brief,.ji-cash{background:var(--blue-l);color:var(--blue)}
.urgent{background:#e5322d;color:#fff;padding:3px 10px;border-radius:6px;font-weight:700;letter-spacing:.02em;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,50,45,.45)}50%{box-shadow:0 0 0 6px rgba(229,50,45,0)}}
.job.is-urgent{border-color:#f3b4b1;box-shadow:0 14px 30px -22px rgba(229,50,45,.6)}
.job h3{margin:0;font-family:var(--display);font-size:1.22rem;font-weight:700;line-height:1.3}
.job ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;color:var(--grey);font-size:.94rem}
.job li{display:flex;align-items:center;gap:8px}
.job li svg{width:17px;height:17px;flex:none;color:var(--blue)}
.job .pay{margin-top:auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-family:var(--display)}
.job .pay b{font-size:1.7rem;font-weight:800;color:var(--ink)}
.job .pay small{font-family:var(--body);color:var(--grey);font-size:.85rem}
.job .btn{width:100%}
.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--grey)}
.nojob{margin-top:28px;padding:24px;border-radius:var(--r);background:var(--soft);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.nojob p{margin:0;font-weight:600;font-size:1.05rem}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--soft);border-radius:var(--r);padding:24px;position:relative}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;margin-bottom:14px}
.steps b{display:block;font-size:1.1rem;margin-bottom:4px}
.steps p{margin:0;color:var(--grey)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* employers */
.band{background:var(--ink);color:#fff}
.band .sub{color:#b8c7dc}
.emp{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.emp ul{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:12px}
.emp li{display:flex;gap:12px;align-items:flex-start}
.emp li svg{width:22px;height:22px;flex:none;color:#7cc0ff;margin-top:2px}
.sectors{display:flex;flex-wrap:wrap;gap:8px}
.sectors span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:.88rem}
.emp-card{background:#fff;color:var(--ink);border-radius:18px;padding:28px}
.emp-card h3{margin:0 0 6px;font-family:var(--display);font-size:1.4rem}
.emp-card p{margin:0 0 18px;color:var(--grey)}
.emp-card .btn{width:100%}
@media (max-width:860px){.emp{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cbox{border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.cbox .lbl{font-size:.8rem;font-weight:600;color:var(--grey)}
.phone{font-family:var(--display);font-weight:700;font-size:1.6rem;text-decoration:none;user-select:all}
.crow,.socials{display:flex;flex-wrap:wrap;gap:8px}
.mini{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:600 .85rem var(--body);cursor:pointer;text-decoration:none}
.mini:hover{border-color:var(--blue);color:var(--blue)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}

footer{background:var(--soft);padding-block:36px 110px;font-size:.88rem;color:var(--grey)}
.flogo{width:140px;height:auto;margin-bottom:14px}
.legal{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:14px}
details{border-top:1px solid var(--line);padding-block:12px}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{max-width:75ch}

.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;padding:12px 18px 12px 14px;border-radius:999px;font-weight:600;text-decoration:none;box-shadow:0 12px 26px -10px rgba(0,0,0,.45)}
.fab svg{width:26px;height:26px}
@media (max-width:620px){.fab span{display:none}.fab{padding:14px}}
.social{margin:0 0 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:#d6e3f3;font-size:.95rem}
.social span{margin-inline-end:4px}
.so{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;text-decoration:none;transition:transform .2s;box-shadow:0 8px 18px -10px rgba(0,0,0,.6)}
.so:hover{transform:translateY(-2px)}
.so svg{width:24px;height:24px}
.so-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.so-tt{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.so-fb{background:#1877F2;border-radius:50%}
.socials .mini{display:inline-flex;align-items:center;gap:7px}
.socials .mini svg{width:18px;height:18px}
.socials .mi-ig svg{color:#d6249f}.socials .mi-fb svg{color:#1877F2}.socials .mi-tt{--tt:1}
.hsoc{display:flex;gap:6px}
.hsoc .so{width:38px;height:38px;border-radius:10px;box-shadow:none}
.hsoc .so-fb{border-radius:50%}
.hsoc .so svg{width:21px;height:21px}
@media (max-width:620px){.hd>.btn-wa{display:none}.hsoc{gap:5px}.hsoc .so{width:34px;height:34px}.hsoc .so svg{width:19px;height:19px}.langs button{padding:5px 6px}}
.note-btn{display:inline-block;margin-top:10px;border:0;background:#1468b8;color:#fff;font:600 .95rem var(--body);padding:9px 14px;border-radius:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:40}
</style>

</head>
<body>
<header>
  <div class="wrap hd">
    <a class="brand" href="#top" aria-label="א.י.א"><img src="logo.webp" alt="א.י.א — כוח אדם, ניקיון, השמה" width="80" height="54"></a>
    <nav class="nav"><a href="#jobs" data-t="navJobs"></a><a href="#how" data-t="howH"></a><a href="#contact" data-t="navContact"></a></nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="he" id="l-he">HE</button>
      <button type="button" data-lang="ru" id="l-ru">RU</button>
      <button type="button" data-lang="en" id="l-en">EN</button>

  const msg={general:L.msgGeneral,nojob:L.msgNo,employer:L.msgEmp};
  document.querySelectorAll("[data-wa]").forEach(a=>a.href=wa(msg[a.dataset.wa]));
  document.getElementById("sectors").innerHTML=L.sectors.map(s=>`<span>${s}</span>`).join("");
  const catDefs=[["kitchen","catK","catKs"],["logistics","catL","catLs"],["clean","catC","catCs"],["other","catO","catOs"],["all","catA","catAs"]];
  document.getElementById("cats").innerHTML=catDefs.map(([c,a,b])=>`<button type="button" class="cat" data-cat="${c}" aria-pressed="${c===cat}"><span class="ic">${I[c]}</span><b>${L[a]}</b><small>${L[b]}</small></button>`).join("");
  const CM=ALLC();const cities=[...CM.keys()].sort((a,b)=>CM.get(a)[lang].localeCompare(CM.get(b)[lang],lang));
  const opts=`<option value="">${L.allCities}</option>`+cities.map(c=>`<option value="${c}" ${c===city?"selected":""}>${CM.get(c)[lang]}</option>`).join("");
  document.getElementById("city2").innerHTML=opts;
  const q2=document.getElementById("q2");q2.placeholder=L.sRolePh;if(document.activeElement!==q2)q2.value=q;
  const qh=document.getElementById("q");if(document.activeElement!==qh)qh.value=q;
  document.getElementById("jchips").innerHTML=catDefs.slice(4).concat(catDefs.slice(0,4)).map(([c,a])=>`<button type="button" class="jchip" data-cat="${c}" aria-pressed="${c===cat}">${L[a]}</button>`).join("");
  const sel=document.getElementById("city");
  sel.innerHTML=opts;
  document.getElementById("q").placeholder=L.sRolePh;
  document.getElementById("openCount").textContent=JOBS.reduce((s,j)=>s+j.n,0);
  const tq=terms(q);
  const okQ=j=>!tq.length||tq.some(t=>hay(j).includes(t));
  let list=JOBS.filter(j=>(cat==="all"||j.cat===cat)&&(!city||CS(j).some(c=>c.he===city))&&okQ(j));
  let note="";
  if(!list.length&&city){const cj=CM.get(city);const cn=cj?cj[lang]:city;const inCity=JOBS.filter(j=>CS(j).some(c=>c.he===city)).length;const alt=JOBS.filter(j=>(cat==="all"||j.cat===cat)&&okQ(j));if(inCity){note=`<p class="note">${L.noMatch(cn)} ${alt.length?L.otherBelow:""}<br><button type="button" class="note-btn" id="cityAll">${L.cityAll(cn,inCity)}</button></p>`;list=alt}else if(alt.length){note=`<p class="note">${L.noCity(cn)}</p>`;list=alt}}
  const qq=q.trim();
  const hint=document.getElementById("hint");if(hint){hint.hidden=!(qq||city);hint.textContent=L.hint(list.length)}
  document.getElementById("count").textContent=L.count(list.length);
  document.getElementById("clear").hidden=!(cat!=="all"||city||qq);
  document.getElementById("grid").innerHTML=(note?`<div style="grid-column:1/-1">${note}</div>`:"")+(list.length?list.map(j=>ticket(j,L)).join(""):`<div class="empty">${L.empty}</div>`);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]");if(b){lang=b.dataset.lang;try{localStorage.setItem("aia-lang",lang)}catch(_){}render();return}
  const c=e.target.closest("[data-cat]");if(c){cat=c.dataset.cat;render();const inJobs=!!c.closest("#jobs");document.querySelector(`#${inJobs?"jchips":"cats"} [data-cat="${cat}"]`)?.focus();if(!inJobs)document.getElementById("jobs").scrollIntoView({behavior:"smooth"});return}
  const cp=e.target.closest("[data-copy]");if(cp){const n=cp.dataset.copy;const done=()=>{const t=document.getElementById("toast");t.textContent=T[lang].copied;t.hidden=false;setTimeout(()=>t.hidden=true,1600)};
    const fb=()=>{const ta=document.createElement("textarea");ta.value=n;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(_){}ta.remove()};navigator.clipboard?navigator.clipboard.writeText(n).then(done,fb):fb();}
});
document.getElementById("city").addEventListener("change",e=>{city=e.target.value;render()});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render()});
document.getElementById("q2").addEventListener("input",e=>{q=e.target.value;render()});
document.getElementById("city2").addEventListener("change",e=>{city=e.target.value;render()});
document.getElementById("search").addEventListener("submit",e=>{e.preventDefault();q=document.getElementById("q").value;render();document.getElementById("jobs").scrollIntoView({behavior:"smooth"})});
document.getElementById("hint").addEventListener("click",()=>document.getElementById("jobs").scrollIntoView({behavior:"smooth"}));
document.getElementById("clear").addEventListener("click",()=>{cat="all";city="";q="";document.getElementById("q").value="";render()});
function segSync(){const e=document.getElementById("employers").getBoundingClientRect();const onEmp=e.top<window.innerHeight*0.5&&e.bottom>120;document.getElementById("seg-emp").setAttribute("aria-current",onEmp);document.getElementById("seg-seek").setAttribute("aria-current",!onEmp)}
window.addEventListener("scroll",segSync,{passive:true});
document.addEventListener("click",e=>{if(e.target.closest("#cityAll")){q="";cat="all";document.getElementById("q").value="";render();document.getElementById("grid").scrollIntoView({behavior:"smooth",block:"start"})}});
render();segSync();

/* Live jobs: read from the published Google Sheet; embedded list is the fallback. */
const SHEET_CSV="__SHEET_CSV__";
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
 else if(c==='"')q=true;else if(c===','){r.push(f);f=""}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}
 if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
const YES=v=>/^(yes|y|1|true|כן|да|v|✓|x)$/i.test(String(v||"").trim());
function rowsToJobs(rows){const h=rows[0].map(x=>x.trim().toLowerCase());const g=(r,k)=>(r[h.indexOf(k)]||"").trim();
 const out=[];for(const r of rows.slice(1)){if(!g(r,"id")||!g(r,"title_he"))continue;const act=g(r,"active");if(act&&!YES(act))continue;
  const c={he:g(r,"city_he"),ru:g(r,"city_ru")||g(r,"city_he"),en:g(r,"city_en")||g(r,"city_he")};
  const sp=l=>c[l].split(",").map(s=>s.trim()).filter(Boolean);
  const j={id:g(r,"id"),cat:["kitchen","logistics","clean","other"].includes(g(r,"category"))?g(r,"category"):"other",n:parseInt(g(r,"count"))||1,
   pay:g(r,"pay")===""||isNaN(+g(r,"pay"))?null:+g(r,"pay"),unit:["h","d","m"].includes(g(r,"unit"))?g(r,"unit"):"h",hours:g(r,"hours"),
   t:{he:g(r,"title_he"),ru:g(r,"title_ru")||g(r,"title_he"),en:g(r,"title_en")||g(r,"title_he")},c,u:YES(g(r,"urgent"))};
  if(sp("he").length>1&&sp("he").length===sp("ru").length&&sp("he").length===sp("en").length)j.cs=sp("he").map((x,i)=>({he:x,ru:sp("ru")[i],en:sp("en")[i]}));
  if(g(r,"note_he"))j.x={he:g(r,"note_he"),ru:g(r,"note_ru")||g(r,"note_he"),en:g(r,"note_en")||g(r,"note_he")};
  out.push(j)}
 return out.filter(j=>j.u).concat(out.filter(j=>!j.u))}
if(SHEET_CSV.startsWith("http"))fetch(SHEET_CSV,{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{const L=rowsToJobs(parseCSV(t));if(L.length){JOBS=L;render()}}).catch(()=>{});
</script>
